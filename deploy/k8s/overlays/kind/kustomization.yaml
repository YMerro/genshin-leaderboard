# Used by CI to deploy into a throwaway kind cluster. Uses the image built in the same CI run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: leaderboard
resources:
  - namespace.yaml
  - ../../base
secretGenerator:
  - name: leaderboard-admin
    literals:
      - password=ci-only-not-a-real-password
images:
  - name: ghcr.io/ymerro/genshin-leaderboard
    newTag: ci
