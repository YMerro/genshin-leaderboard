# Published on the internet through Tailscale Funnel at a fixed address:
#   https://leaderboard.<your-tailnet>.ts.net
# Needs the Tailscale Kubernetes operator installed in the cluster (see docs/home-cluster.md).
# To keep it private to your own Tailscale devices only, remove the funnel annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leaderboard
  annotations:
    tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: leaderboard
      port:
        name: http
  tls:
    - hosts:
        - leaderboard   # becomes leaderboard.<your-tailnet>.ts.net
