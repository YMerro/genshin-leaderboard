apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: genshin-leaderboard
    includeSelectors: true
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: leaderboard-config
    literals:
      - SERVER_PORT=8081
      - APP_DATADIR=/data
      - APP_ENKA_MINCACHETTL=60s
images:
  - name: genshin-leaderboard
    newName: ghcr.io/ymerro/genshin-leaderboard
    newTag: latest
