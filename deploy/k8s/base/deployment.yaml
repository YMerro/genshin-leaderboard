# Single replica on purpose: data is stored as files on one volume, and the daily snapshot is an
# in-app scheduled job. Recreate makes sure two pods never write the volume at the same time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaderboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: genshin-leaderboard
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: leaderboard-config
          env:
            - name: APP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leaderboard-admin
                  key: password
                  optional: true   # without it the app runs read-only for admin actions
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: leaderboard-data
        - name: tmp
          emptyDir: {}
