spring.application.name=genshin-leaderboard

# 8081 so it can run alongside excuse-o-matic on 8080
server.port=8081

# Browsers re-check page files on each load, so updates show up without a hard refresh
spring.web.resources.cache.cachecontrol.no-cache=true

# Where friends.json and the cached Enka game data live
app.data-dir=./data

app.enka.base-url=https://enka.network
app.enka.user-agent=genshin-friends-leaderboard/0.1
# Enka tells us how long a profile stays fresh (ttl); never re-fetch more often than this
app.enka.min-cache-ttl=60s
app.enka.timeout=15s

# Character names, icons, profile pictures and name cards
app.store.base-url=https://raw.githubusercontent.com/EnkaNetwork/API-docs/master/store/gi/
app.store.refresh-after=24h

# Admin password for adding/removing players and deleting wish history.
# Never put it here: set it in config/application.properties next to the jar,
# or with the APP_ADMIN_PASSWORD environment variable. Blank = admin actions disabled.
app.admin.password=

# Save a progress snapshot every day at 06:00 (only while the app is running)
app.history.snapshot-cron=0 0 6 * * *


# Health checks for Docker/Kubernetes: /actuator/health, /actuator/health/liveness, /actuator/health/readiness
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
