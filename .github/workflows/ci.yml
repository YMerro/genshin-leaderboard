name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ymerro/genshin-leaderboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Render Kustomize
        run: |
          kubectl kustomize deploy/k8s/base > /dev/null
          kubectl kustomize deploy/k8s/overlays/kind > /dev/null

  image:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy, report only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 "$IMAGE:ci"

      - name: Smoke test in kind
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - run: |
          kind load docker-image "$IMAGE:ci" --name ci
          kubectl apply -k deploy/k8s/overlays/kind
          kubectl -n leaderboard rollout status deploy/leaderboard --timeout=180s
          kubectl -n leaderboard port-forward svc/leaderboard 8081:80 &
          sleep 5
          curl -fsS http://localhost:8081/actuator/health/readiness
          curl -fsS http://localhost:8081/ | grep -qi leaderboard
          curl -fsS http://localhost:8081/api/friends
      - name: Show pod logs on failure
        continue-on-error: true
        if: failure()
        run: |
          kubectl -n leaderboard get pods,pvc,events
          kubectl -n leaderboard logs deploy/leaderboard --tail=200 || true

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:ci" "$IMAGE:sha-${GITHUB_SHA::7}"
          docker tag "$IMAGE:ci" "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
